name: Tumblr Auto Upload
run-name: Tumblr Local ${{ inputs.source_sha256 }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build preview only; no auth, download, upload, or log commit'
        type: boolean
        default: true
      source_asset_name:
        description: 'Temporary media-host release asset selected from local 000_Tumblr_movie'
        type: string
        default: ''
      source_sha256:
        description: 'Expected SHA-256 of the dispatched local video'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytumblr pytrends

      - name: Require local source for live runs
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && inputs.source_asset_name == '' }}
        run: |
          echo "Live Tumblr runs require a video dispatched from local 000_Tumblr_movie."
          exit 1

      - name: Download dispatched local video
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && inputs.source_asset_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ASSET_NAME: ${{ inputs.source_asset_name }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          mkdir -p dispatched_media
          gh release download media-host --pattern "$SOURCE_ASSET_NAME" --dir dispatched_media
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          path = Path("dispatched_media") / os.environ["SOURCE_ASSET_NAME"]
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = os.environ["SOURCE_SHA256"].strip().lower()
          if not expected or digest != expected:
              raise SystemExit(f"SHA-256 mismatch: {digest} != {expected}")
          print(f"LOCAL_SOURCE_OK file={path.name} sha256={digest[:12]}")
          PY
          echo "TUMBLR_LOCAL_MEDIA_DIR=$GITHUB_WORKSPACE/dispatched_media" >> "$GITHUB_ENV"

      - name: Run dry-run preview
        id: dryrun
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python upload.py --dry-run

      - name: Upload dry-run preview artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: tumblr-dry-run-preview
          path: dry_run_tumblr_preview.json

      - name: Run upload (attempt 1)
        id: attempt1
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
          TUMBLR_FORCE_POST: '1'
        run: python upload.py

      - name: Wait before retry 2
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.attempt1.outcome == 'failure' }}
        run: echo "Attempt 1 failed. Waiting 60s..." && sleep 60

      - name: Run upload (attempt 2)
        id: attempt2
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.attempt1.outcome == 'failure' }}
        continue-on-error: true
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
          TUMBLR_FORCE_POST: '1'
        run: python upload.py

      - name: Wait before retry 3
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' }}
        run: echo "Attempt 2 failed. Waiting 120s..." && sleep 120

      - name: Run upload (attempt 3)
        id: attempt3
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' }}
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
          TUMBLR_FORCE_POST: '1'
        run: python upload.py

      - name: Collect engagement and commit variant logs
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
        run: |
          python collect_engagement.py || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log.json 2>/dev/null || true
          git add engagement.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "auto: variant log + engagement [skip ci]"
          git pull --rebase --autostash || true
          git push || true

      - name: Delete temporary local-video asset
        if: ${{ always() && inputs.source_asset_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ASSET_NAME: ${{ inputs.source_asset_name }}
        run: gh release delete-asset media-host "$SOURCE_ASSET_NAME" -y || true

      - name: LINE notify on failure
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.attempt1.outcome == 'failure' && (steps.attempt2.outcome == 'failure' || steps.attempt2.outcome == 'skipped') && (steps.attempt3.outcome == 'failure' || steps.attempt3.outcome == 'skipped') }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LINE_CHANNEL_TOKEN}" \
            -d "{
              \"to\": \"${LINE_USER_ID}\",
              \"messages\": [{
                \"type\": \"text\",
                \"text\": \"⚠️ Tumblr自動投稿が3回リトライしても失敗しました\\n\\n時刻: $(TZ=Asia/Tokyo date +%Y-%m-%d\ %H:%M\ JST)\\nログ: https://github.com/MuscleLove-777/tumblr-auto-uploader/actions/runs/${{ github.run_id }}\"
              }]
            }"

      - name: LINE notify on success
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (steps.attempt1.outcome == 'success' || steps.attempt2.outcome == 'success' || steps.attempt3.outcome == 'success') }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          RETRY_INFO=""
          if [ "${{ steps.attempt2.outcome }}" = "success" ]; then RETRY_INFO="（2回目で成功）"; fi
          if [ "${{ steps.attempt3.outcome }}" = "success" ]; then RETRY_INFO="（3回目で成功）"; fi
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LINE_CHANNEL_TOKEN}" \
            -d "{
              \"to\": \"${LINE_USER_ID}\",
              \"messages\": [{
                \"type\": \"text\",
                \"text\": \"✅ Tumblr自動投稿 成功${RETRY_INFO}\\n時刻: $(TZ=Asia/Tokyo date +%Y-%m-%d\ %H:%M\ JST)\"
              }]
            }"
