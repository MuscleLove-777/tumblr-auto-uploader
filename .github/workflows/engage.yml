name: Tumblr Engage (likes)

# ★スケジュール無し = 勝手に動かない。手動trigger式で段階リリース。
# 既定は dry-run(likeせず対象だけ表示)。安全確認後に dry_run=false で実likeを少量。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run（likeせず対象だけ表示）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytumblr
      - name: Run engage
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python engage.py --dry-run
          else
            python engage.py
          fi
      - name: Commit engage log
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add engaged_log.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "engage log [skip ci]"
          git pull --rebase --autostash || true
          git push || true
